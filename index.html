<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbd3e0">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"rosa"}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fde7ee;--bg2:#fbd3e0;--card:#fff6f9;--line:#f6c9d8;--rose:#f2a7bf;--rd:#c2557d;--ink:#5a3441;--mut:#9a6f7d;--ok:#3f8f6b;--bad:#cf5a67;--b1:#fbd0de;--b2:#f5a9c0;--bi:#6a2540;--soft:#fde0ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg) 300px) no-repeat}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:500 15px/1.4 Quicksand,system-ui,sans-serif;padding:0 16px 96px;max-width:560px;margin-inline:auto}
h1{font-size:24px;margin:18px 0 10px;color:var(--rd)}h2{font-size:18px;margin:0}h3{font-size:14px;margin:18px 0 8px;color:var(--mut)}
.per{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.per button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:7px 14px;font:600 13px inherit;font-family:inherit}
.per button.on{background:var(--b2);color:var(--bi);border-color:var(--rose)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 3px 12px rgba(235,150,175,.10)}
.card small,.item small{display:block;color:var(--mut);font-size:12px}
.card b{font-size:19px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.row,.row2{display:flex;gap:10px;margin:12px 0;align-items:center}.row2{justify-content:space-between;margin-top:20px}
.row>*{flex:1}
.btn{border:1px solid var(--rose);background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--bi);border-radius:20px;padding:13px 16px;font:700 14px Quicksand,system-ui,sans-serif;width:100%;text-align:center;box-shadow:0 4px 12px rgba(235,150,175,.20)}
.row2 .btn{width:auto;padding:9px 16px}
.btn.alt{background:var(--soft);color:var(--rd);margin-top:6px;display:block;box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#4a1f26}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 8px rgba(235,150,175,.08)}
.item .g{flex:1}.r{text-align:right}
.th{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
.ph{display:grid;place-items:center;background:var(--line);color:var(--rose)}
.chart{display:flex;gap:6px;align-items:flex-end;height:150px;overflow-x:auto}
.chart div{flex:1;min-width:28px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart i{display:block;width:100%;background:linear-gradient(180deg,var(--b2),var(--rose));border-radius:10px 10px 4px 4px;min-height:3px}
.chart b{font-size:10px;color:var(--mut);margin-top:4px;height:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:11px 2px;border-radius:14px;font:700 12px Quicksand,system-ui,sans-serif;color:var(--mut)}
nav button.on{background:var(--b2);color:var(--bi)}
.ov{position:fixed;inset:0;background:rgba(110,60,80,.28);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0;font-weight:600}
input,select{width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 15px Quicksand,system-ui,sans-serif}
.pick{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.pick button{flex:none;width:76px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px;color:var(--ink);font-family:inherit}
.pick img,.pick .ph{width:100%;height:56px;border-radius:10px;object-fit:cover}
.pick small{display:block;font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph2{display:flex;gap:12px;align-items:center;margin-top:10px}.ph2 img{width:64px;height:64px;border-radius:14px;object-fit:cover}.ph2 .btn{width:auto;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;z-index:20;display:none}
html[data-theme=branco]{--bg:#fff;--bg2:#fff;--card:#fff;--line:#f3d9e2;--rose:#f2a7bf;--ink:#4a3139;--mut:#8e7a82;--soft:#fff5f8}
html[data-theme=escuro]{--bg:#1f171b;--bg2:#2b1f25;--card:#2d2228;--line:#4a3640;--rose:#e58aa8;--rd:#f4a6c0;--ink:#f6e9ee;--mut:#b99ca8;--b1:#e58aa8;--b2:#d4708f;--bi:#2a0f1a;--soft:#3a2a32;--ok:#7fd1a8;--bad:#f2868f;color-scheme:dark}
html[data-theme=escuro] .card,html[data-theme=escuro] .item{box-shadow:none}
.plist{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);margin:10px 0}
.pi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}.pi:last-child{border-bottom:0}.pi:active{background:var(--soft)}.pi.sel{background:var(--b1)}.pi .th{width:34px;height:34px;border-radius:10px}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg) 300px) no-repeat;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.dots{display:flex;gap:14px;height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rd)}.dots i.f{background:var(--rd)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}.keys button{height:72px;border-radius:50%;border:1px solid var(--rose);background:var(--b1);color:var(--bi);font:700 22px Quicksand,system-ui,sans-serif}
</style>
</head>
<body>
<div id="app"></div><div id="lock" class="lock"></div><nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const br=s=>String(s).split('-').reverse().join('/');
let D={prods:[],procs:[],reg:[],exp:[]},ref=null,admin=true,tab='res',per='mes',from='',to='',tmp='',saving=Promise.resolve();

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function save(){render();if(ref){saving=saving.then(()=>ref.set(D)).catch(()=>toast('Não salvou. Confira sua conexão e tente de novo.'))}else{try{localStorage.setItem('d',JSON.stringify(D))}catch(e){toast('Não foi possível salvar: armazenamento cheio. Faça um backup e remova fotos.')}}}
function range(){const t=new Date(),h=iso(t),m=h.slice(0,8);
 if(per=='hoje')return[h,h];
 if(per=='sem'){const d=new Date(t);d.setDate(t.getDate()-6);return[iso(d),h]}
 if(per=='mes')return[m+'01',m+'31'];
 if(per=='cus')return[from||'0000',to||'9999'];
 return['0000','9999']}
const inR=x=>{const[a,b]=range();return x.date>=a&&x.date<=b};
const regs=t=>D.reg.filter(r=>(!t||r.t==t)&&inR(r)).sort((a,b)=>b.date.localeCompare(a.date));
const sum=l=>({fat:l.reduce((s,r)=>s+r.price*r.qty,0),cus:l.reduce((s,r)=>s+r.cost*r.qty,0)});
const card=(l,v,c='',sub='')=>`<div class=card><small>${l}</small><b class="${c}">${v}</b>${sub?`<small>${sub}</small>`:''}</div>`;
const fld=(l,k,t,v)=>`<label>${l}<input id="f_${k}" type="${t}" ${t=='number'?'step="0.01" inputmode="decimal"':''} value="${esc(v)}"></label>`;
const sel=(l,k,o,v)=>`<label>${l}<select id="f_${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></label>`;
const modal=h=>$('#modal').innerHTML=`<div class=ov onclick="if(event.target==this)closeM()"><div class=sheet>${h}</div></div>`;
const closeM=()=>$('#modal').innerHTML='';

function head(){return `<h1>Meu Studio</h1><div class=per>${[['hoje','Hoje'],['sem','7 dias'],['mes','Este mês'],['tudo','Tudo'],['cus','Escolher datas']].map(([k,l])=>`<button class="${per==k?'on':''}" onclick="per='${k}';render()">${l}</button>`).join('')}</div>${per=='cus'?`<div class=row><label>De<input type=date value="${from}" onchange="from=this.value;render()"></label><label>Até<input type=date value="${to}" onchange="to=this.value;render()"></label></div>`:''}`}

function vRes(){const a=regs(),e=D.exp.filter(inR),s=sum(a),sa=e.reduce((x,y)=>x+y.val,0),lu=s.fat-s.cus-sa;
 const st=sum(a.filter(r=>r.t=='s')),vd=sum(a.filter(r=>r.t=='v'));
 const by={};a.forEach(r=>by[r.date]=(by[r.date]||0)+r.price*r.qty);
 const ks=Object.keys(by).sort().slice(-14),mx=Math.max(1,...ks.map(k=>by[k]));
 return `${needBk()?`<div class=card onclick="tab='cfg';render()"><b>Hora de fazer backup</b><small>Toque para salvar uma cópia dos seus dados.</small></div>`:''}<div class=grid>${card('Faturamento',R(s.fat))}${card('Lucro líquido',R(lu),lu>=0?'ok':'bad')}${card('Custo dos itens',R(s.cus))}${card('Saídas',R(sa))}</div>
 <h3>Por área</h3><div class=grid>${card('Studio',R(st.fat),'','lucro '+R(st.fat-st.cus))}${card('Vendas',R(vd.fat),'','lucro '+R(vd.fat-vd.cus))}</div>
 <h3>Faturamento por dia</h3><div class="card chart">${ks.length?ks.map(k=>`<div><i style="height:calc((100% - 16px)*${by[k]/mx})"></i><b>${k.slice(8)}/${k.slice(5,7)}</b></div>`).join(''):'<span class=mut>Nenhum registro neste período.</span>'}</div>
 <div class=row><button class=btn onclick="newReg('s')">+ Atendimento</button><button class=btn onclick="newReg('v')">+ Venda</button></div>
 <button class="btn alt" onclick="newExp()">+ Saída</button><button class="btn alt" onclick="expo()">Exportar para Excel</button>`}

function vReg(t){const L=regs(t),s=sum(L);
 return `<div class=row2><h2>${t=='s'?'Atendimentos do Studio':'Vendas'}</h2><button class=btn onclick="newReg('${t}')">+ Novo</button></div>
 <div class=grid>${card('Faturamento',R(s.fat))}${card('Lucro',R(s.fat-s.cus),s.fat-s.cus>=0?'ok':'bad')}</div>
 ${L.length?L.map(r=>`<div class=item onclick="newReg('${t}','${r.id}')"><div><b>${esc(r.name)}${r.qty>1?' ×'+r.qty:''}</b><small>${br(r.date)}, ${esc(r.pay)}${t=='v'?', '+esc(r.cat):''}</small></div><div class=r><b>${R(r.price*r.qty)}</b><small class=ok>lucro ${R((r.price-r.cost)*r.qty)}</small></div></div>`).join(''):'<p class=mut>Nenhum registro neste período. Toque em + Novo para começar.</p>'}
 <button class="btn alt" onclick="expo()">Exportar para Excel</button>`}

function vSai(){const L=D.exp.filter(inR).sort((a,b)=>b.date.localeCompare(a.date)),t=L.reduce((s,x)=>s+x.val,0);
 return `<div class=row2><h2>Saídas</h2><button class=btn onclick="newExp()">+ Nova</button></div><div class=grid>${card('Total de saídas',R(t),'bad')}</div>
 ${L.length?L.map(x=>`<div class=item onclick="newExp('${x.id}')"><div><b>${esc(x.desc)}</b><small>${br(x.date)}, ${esc(x.cat)}</small></div><b class=bad>${R(x.val)}</b></div>`).join(''):'<p class=mut>Nenhuma saída neste período.</p>'}`}

function vCfg(){const sec=(k,t,L)=>`<div class=row2><h2>${t}</h2><button class=btn onclick="newItem('${k}')">+ Novo</button></div>${L.length?L.map(p=>`<div class=item onclick="newItem('${k}','${p.id}')">${p.photo?`<img class=th src="${p.photo}">`:'<span class="th ph">✿</span>'}<div class=g><b>${esc(p.name)}</b><small>custo ${R(p.cost)}, venda ${R(p.price)}</small></div><div class=r><b class=ok>${R(p.price-p.cost)}</b><small>${p.price?Math.round((p.price-p.cost)/p.price*100):0}% de margem</small></div></div>`).join(''):'<p class=mut>Nada cadastrado ainda.</p>'}`;
 return sec('prods','Produtos',D.prods)+sec('procs','Procedimentos do Studio',D.procs)+`<button class="btn alt" onclick="loadSeed()">Carregar lista inicial de produtos e serviços</button><h3>Aparência</h3><div class=per>${Object.keys(TH).map(k=>`<button class="${(document.documentElement.dataset.theme||'rosa')==k?'on':''}" onclick="setTheme('${k}');render()">${TH[k][0]}</button>`).join('')}</div><h3>Backup e segurança</h3><div class=card><small>Último backup: ${localStorage.getItem('lastBk')?br(localStorage.getItem('lastBk')):'nunca'}</small><div class=row><button class=btn onclick="bkp('down')">Salvar backup</button>${canShare()?`<button class=btn onclick="bkp('share')">Compartilhar</button>`:''}</div><label class="btn alt">Restaurar backup<input type=file accept=".json,application/json" hidden onchange="restore(this)"></label><button class="btn alt" onclick="changePin()">Alterar PIN</button></div><p class=mut>Os dados ficam salvos só neste aparelho. Faça backup com frequência.</p>`}

function render(){
 const tabs=[['res','Resumo'],['stu','Studio'],['ven','Vendas'],['sai','Saídas']];if(admin)tabs.push(['cfg','Config.']);
 if(!tabs.some(t=>t[0]==tab))tab='res';
 $('#app').innerHTML=head()+({res:vRes,stu:()=>vReg('s'),ven:()=>vReg('v'),sai:vSai,cfg:vCfg}[tab])();
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${l}</button>`).join('')}

function newReg(t,id){
 const r=id?D.reg.find(x=>x.id==id):{t,date:iso(new Date()),name:'',cat:'Cosméticos',qty:1,price:'',cost:'',pay:'Pix'};
 const src=t=='s'?D.procs:D.prods;
 modal(`<h2>${id?'Editar':'Novo'} ${t=='s'?'atendimento':'venda'}</h2>
 ${src.length?`<label>Buscar ${t=='s'?'procedimento':'produto'}<input id=q type=search placeholder="Digite para filtrar" oninput="fl('${t}')"></label><div class=plist id=pl>${plist(t,'')}</div>`:'<p class=mut>Cadastre itens em Config. para escolher aqui com um toque.</p>'}
 ${fld('Data','date','date',r.date)}${fld(t=='s'?'Procedimento':'Produto','name','text',r.name)}
 ${t=='v'?sel('Categoria','cat',['Cosméticos','Joias'],r.cat)+fld('Quantidade','qty','number',r.qty):''}
 ${fld('Valor de venda, por unidade (R$)','price','number',r.price)}${fld('Custo, por unidade (R$)','cost','number',r.cost)}${sel('Pagamento','pay',['Pix','Dinheiro','Cartão'],r.pay)}
 <div class=row><button class=btn onclick="saveReg('${t}','${id||''}')">Salvar</button>${id?`<button class="btn danger" onclick="del('reg','${id}',this)">Excluir</button>`:''}</div>`)}
const nz=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function plist(t,q){const L=(t=='s'?D.procs:D.prods).filter(p=>nz(p.name).includes(nz(q))).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
 return L.length?L.map(p=>`<div class=pi onclick="pickIt('${p.id}','${t}')">${p.photo?`<img class=th src="${p.photo}">`:'<span class="th ph">✿</span>'}<div class=g><b>${esc(p.name)}</b></div><b>${R(p.price)}</b></div>`).join(''):'<p class=mut style="padding:8px 12px">Nenhum item encontrado.</p>'}
function fl(t){$('#pl').innerHTML=plist(t,$('#q').value)}
function pickIt(id,t){const p=(t=='s'?D.procs:D.prods).find(x=>x.id==id);if(!p)return;const s=(k,v)=>{const e=$('#f_'+k);if(e&&v!=null)e.value=v};s('name',p.name);s('price',p.price);s('cost',p.cost);s('cat',p.cat);document.querySelectorAll('.pi').forEach(e=>e.classList.toggle('sel',e.getAttribute('onclick').indexOf("'"+id+"'")>-1))}
function saveReg(t,id){const g=k=>$('#f_'+k)?.value||'';
 const r={id:id||uid(),t,date:g('date'),name:g('name').trim(),cat:t=='v'?g('cat'):'Studio',qty:t=='v'?Math.max(1,+g('qty')||1):1,price:+g('price')||0,cost:+g('cost')||0,pay:g('pay')};
 if(!r.date||!r.name)return toast('Preencha a data e o nome.');
 D.reg=id?D.reg.map(x=>x.id==id?r:x):[...D.reg,r];closeM();save()}

function newExp(id){const x=id?D.exp.find(e=>e.id==id):{date:iso(new Date()),desc:'',cat:'Materiais',val:''};
 modal(`<h2>${id?'Editar':'Nova'} saída</h2>${fld('Data','date','date',x.date)}${fld('Descrição','desc','text',x.desc)}${sel('Categoria','cat',['Materiais','Aluguel','Marketing','Transporte','Outros'],x.cat)}${fld('Valor (R$)','val','number',x.val)}
 <div class=row><button class=btn onclick="saveExp('${id||''}')">Salvar</button>${id?`<button class="btn danger" onclick="del('exp','${id}',this)">Excluir</button>`:''}</div>`)}
function saveExp(id){const g=k=>$('#f_'+k)?.value||'';const x={id:id||uid(),date:g('date'),desc:g('desc').trim(),cat:g('cat'),val:+g('val')||0};
 if(!x.date||!x.desc)return toast('Preencha a data e a descrição.');
 D.exp=id?D.exp.map(e=>e.id==id?x:e):[...D.exp,x];closeM();save()}

function newItem(k,id){tmp='';const p=id?D[k].find(x=>x.id==id):{name:'',cat:'Cosméticos',cost:'',price:'',photo:''};
 modal(`<h2>${id?'Editar':'Novo'} ${k=='prods'?'produto':'procedimento'}</h2>
 <div class=ph2><img id=pv ${p.photo?`src="${p.photo}"`:'style="display:none"'}><label class="btn alt">Escolher foto<input type=file accept="image/*" hidden onchange="photo(this)"></label></div>
 ${fld('Nome','name','text',p.name)}${k=='prods'?sel('Categoria','cat',['Cosméticos','Joias'],p.cat):''}${fld('Preço de custo (R$)','cost','number',p.cost)}${fld('Preço de venda (R$)','price','number',p.price)}
 <div class=row><button class=btn onclick="saveItem('${k}','${id||''}')">Salvar</button>${id?`<button class="btn danger" onclick="del('${k}','${id}',this)">Excluir</button>`:''}</div>`)}
function photo(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,140/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmp=c.toDataURL('image/jpeg',.6);const v=$('#pv');v.src=tmp;v.style.display='block'};im.src=URL.createObjectURL(f)}
function saveItem(k,id){const g=x=>$('#f_'+x)?.value||'',old=id?D[k].find(x=>x.id==id):{};
 const p={id:id||uid(),name:g('name').trim(),cost:+g('cost')||0,price:+g('price')||0,photo:tmp||old.photo||''};if(k=='prods')p.cat=g('cat');
 if(!p.name)return toast('Digite o nome.');
 D[k]=id?D[k].map(x=>x.id==id?p:x):[...D[k],p];closeM();save()}

function del(k,id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Toque de novo para excluir';return}D[k]=D[k].filter(x=>x.id!=id);closeM();save()}

function expo(){const[a,b]=range();modal(`<h2>Exportar para Excel</h2>${fld('De','xa','date',a=='0000'?'':a)}${fld('Até','xb','date',b=='9999'?'':b)}${sel('O que exportar','xt',['Tudo','Studio','Vendas'],'Tudo')}<div class=row><button class=btn onclick="doExp('down')">Baixar</button>${canShare()?`<button class=btn onclick="doExp('share')">Compartilhar</button>`:''}</div>`)}
const XM='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const canShare=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.json',{type:'application/json'})]}))}catch(e){return false}};
function deliver(blob,name,mode){if(mode=='share'){navigator.share({files:[new File([blob],name,{type:blob.type})],title:name}).catch(()=>{});return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function doExp(mode){const a=$('#f_xa').value||'0000',b=$('#f_xb').value||'9999',t=$('#f_xt').value;
 const L=D.reg.filter(r=>r.date>=a&&r.date<=b&&(t=='Tudo'||(t=='Studio'?r.t=='s':r.t=='v'))).sort((x,y)=>x.date.localeCompare(y.date));
 const E=D.exp.filter(e=>e.date>=a&&e.date<=b).sort((x,y)=>x.date.localeCompare(y.date));
 if(!L.length&&!E.length)return toast('Nenhum registro nesse período.');
 const fat=L.reduce((s,r)=>s+r.price*r.qty,0),cus=L.reduce((s,r)=>s+r.cost*r.qty,0),sai=E.reduce((s,e)=>s+e.val,0);
 const r1=[['Data','Área','Item','Categoria','Qtd','Valor unit.','Custo unit.','Total','Lucro','Pagamento'],...L.map(r=>[br(r.date),r.t=='s'?'Studio':'Vendas',r.name,r.cat,r.qty,r.price,r.cost,r.price*r.qty,(r.price-r.cost)*r.qty,r.pay]),[],['TOTAIS','','','','','','',fat,fat-cus,''],['Saídas no período','','','','','','',sai],['LUCRO LÍQUIDO','','','','','','',fat-cus-sai]];
 const r2=[['Data','Descrição','Categoria','Valor'],...E.map(e=>[br(e.date),e.desc,e.cat,e.val]),[],['TOTAL','','',sai]];
 const base='relatorio_'+(a=='0000'?'inicio':a)+'_'+(b=='9999'?'hoje':b);let blob,name;
 if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r1),'Registros');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r2),'Saídas');blob=new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:XM});name=base+'.xlsx'}
 else{const c=r=>r.map(x=>x.map(v=>typeof v=='number'?String(v).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');blob=new Blob(['\ufeff'+c(r1)+'\n\n'+c(r2)],{type:'text/csv'});name=base+'.csv';toast('Sem internet: gerei uma planilha simples (CSV), que o Excel também abre.')}
 deliver(blob,name,mode);closeM()}
function needBk(){const l=localStorage.getItem('lastBk');if(!(D.reg.length||D.exp.length||D.prods.length))return false;return !l||Date.now()-new Date(l+'T00:00')>7*864e5}
function bkp(mode){const blob=new Blob([JSON.stringify({app:'meu-studio',v:1,date:new Date().toISOString(),data:D})],{type:'application/json'});localStorage.setItem('lastBk',iso(new Date()));deliver(blob,'backup_meu_studio_'+iso(new Date())+'.json',mode);render()}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data||o;if(!['prods','procs','reg','exp'].every(k=>Array.isArray(d[k])))throw 0;if(!confirm('Restaurar o backup? Isso substitui os dados atuais pelos do arquivo ('+d.reg.length+' lançamentos, '+d.exp.length+' saídas).'))return;D={prods:d.prods,procs:d.procs,reg:d.reg,exp:d.exp};save();toast('Backup restaurado.')}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f);inp.value=''}
let P={m:'ask',v:'',f:'',t:0,n:0,msg:''},hiddenAt=0;
async function hp(p){const s='studio'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
function lockDraw(){const e=$('#lock');e.style.display='flex';e.innerHTML=`<h1>🌸 Meu Studio</h1><b>${P.msg}</b><div class=dots>${[0,1,2,3].map(i=>`<i class="${i<P.v.length?'f':''}"></i>`).join('')}</div><div class=keys>${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button ${k===''?'style="visibility:hidden"':''} onclick="key('${k}')">${k}</button>`).join('')}</div>${P.m=='ask'?'<small class=mut onclick="forgot()" style="text-decoration:underline;padding:8px">Esqueci o PIN</small>':''}`}
function startLock(){P.v='';if(localStorage.getItem('pin')){P.m='ask';P.msg='Digite seu PIN'}else{P.m='new';P.msg='Crie um PIN de 4 números'}lockDraw()}
function unlock(){P.v='';$('#lock').style.display='none';render()}
async function key(k){if(Date.now()<P.t)return;if(k=='⌫'){P.v=P.v.slice(0,-1);return lockDraw()}
 if(P.v.length>=4)return;P.v+=k;lockDraw();if(P.v.length<4)return;const x=P.v;P.v='';const again=m=>{P.msg=m;setTimeout(lockDraw,150)};
 if(P.m=='new'){P.f=x;P.m='conf';return again('Repita o PIN para confirmar')}
 if(P.m=='conf'){if(x==P.f){localStorage.setItem('pin',await hp(x));return unlock()}P.m='new';return again('Os PINs não batem. Crie de novo')}
 if(await hp(x)==localStorage.getItem('pin')){P.n=0;return unlock()}
 P.n++;if(P.n>=5){P.t=Date.now()+30000;P.n=0;return again('Muitas tentativas. Aguarde 30 segundos')}again('PIN incorreto')}
function forgot(){if(confirm('Para criar um novo PIN, os dados deste aparelho serão apagados. Depois você pode restaurar o seu backup. Continuar?')){localStorage.clear();D={prods:[],procs:[],reg:[],exp:[]};startLock()}}
